name: ETHBIBLE Load D1

# Живее тук, защото CLOUDFLARE_API_TOKEN е тайна на това репо (както Deploy SOMBRA).
# Зарежда стиховете в D1 "ethbible". Текстът съществува само в runner-а:
# не се комитва и не се печата (логът е публичен) — отчетът съдържа само бройки.
# Всяка стъпка дописва в отчета, за да се вижда къде е спряло без достъп до логовете.

on:
  push:
    paths: ['.github/workflows/ethbible-load.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  R: ethbible-load-report.txt

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start report
        run: echo "== ETHBIBLE load $(date -u) ==" > $R

      - name: Tools
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq poppler-utils > /dev/null
          echo "tools: $(pdftotext -v 2>&1 | head -1)" >> $R

      - name: Fetch ETHBIBLE scripts (през API, не raw CDN)
        run: |
          for f in parse_verses.py load_d1.py; do
            code=$(curl -sL -w '%{http_code}' -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/emillion-lab/ETHBIBLE/contents/scripts/$f" -o /tmp/$f)
            echo "script $f: http $code, $(wc -c < /tmp/$f) bytes" >> $R
            python3 -m py_compile /tmp/$f
          done
          grep -q "Psalm 151" /tmp/parse_verses.py || { echo "стар парсер" >> $R; exit 1; }

      - name: Download PDF (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "74820d71c551391ce31d309c2fcb091c"
        run: |
          npx --yes wrangler@4 r2 object get ethbible/EthiopianOrthodoxBible.PDF --file /tmp/eob.pdf --remote > /tmp/r2.log 2>&1 || true
          echo "r2 log: $(tail -c 300 /tmp/r2.log | tr '\n' ' ')" >> $R
          echo "pdf: $(wc -c < /tmp/eob.pdf 2>/dev/null || echo 0) bytes, magic $(head -c 5 /tmp/eob.pdf 2>/dev/null | tr -dc '[:print:]')" >> $R
          PAGES=$(pdfinfo /tmp/eob.pdf 2>/dev/null | awk '/^Pages:/{print $2}')
          echo "pages: ${PAGES:-none}" >> $R
          [ "$PAGES" = "2151" ] || exit 1

      - name: Parse
        run: |
          pdftotext /tmp/eob.pdf /tmp/eob.txt
          python3 /tmp/parse_verses.py /tmp/eob.txt /tmp/verses.jsonl >> $R 2>&1

      - name: Load into D1
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: "74820d71c551391ce31d309c2fcb091c"
          D1_ID: "58e99aac-f819-4831-b370-10fd2307e68a"
        run: python3 /tmp/load_d1.py /tmp/verses.jsonl >> $R 2>&1

      - name: Commit report (само бройки)
        if: always()
        run: |
          echo "job status: ${{ job.status }}" >> $R
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add $R
          git commit -m "ethbible load report [skip ci]" || true
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
