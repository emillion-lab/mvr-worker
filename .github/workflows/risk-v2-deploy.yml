name: Risk V2 Deploy
on:
  workflow_dispatch:
  schedule: [{ cron: '*/10 * * * *' }]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          if grep -q 'RISK_V2' src/worker.js; then
            echo "вече е приложено — нищо за правене"
            exit 0
          fi

          echo ">>> прилагам патча"
          python3 scripts/patch_risk_v2.py
          node --check src/worker.js
          echo ">>> синтаксисът е наред"
          grep -c 'RISK_V2' src/worker.js

          echo ">>> deploy"
          cp src/worker.js /tmp/worker.js
          ACC="74820d71c551391ce31d309c2fcb091c"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["secret_text","plain_text"],"bindings":[{"type":"kv_namespace","name":"GPS_STORE","namespace_id":"2900a1d9de0f49deac2359e558ba5783"}],"compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@/tmp/worker.js;type=application/javascript+module" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('deploy success:',d.get('success'),d.get('errors'))"

          echo ">>> чистя кеша на риска (иначе 40 мин ще връща старото)"
          sleep 6
          curl -s "https://mvr-proxy.mihov-emil.workers.dev/risk?nocache=$RANDOM" > /tmp/r1.json || true

          echo ">>> нов отговор:"
          cat /tmp/r1.json

          mkdir -p data
          cp /tmp/r1.json data/risk_v2_check.json || true

          git config user.name ci; git config user.email ci@mvr
          git add src/worker.js data/risk_v2_check.json
          git commit -m "worker: /risk v2 — recalibrated model, Kp/moon/pressure removed [skip ci]"
          git fetch origin main && git rebase origin/main || true
          git push
