name: Pull Live Worker
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/74820d71c551391ce31d309c2fcb091c/workers/scripts/mvr-proxy" \
            -o live-worker.js
          echo "--- размер ---"; wc -c live-worker.js
          echo "--- endpoints в живия код ---"
          grep -o "path === '/[a-z/]*'\|path.startsWith('/[a-z]*/'" live-worker.js | sort -u | head -30
          echo "--- прозорец за полети ---"
          grep -o "offsetMinutes=-\?[0-9]*&durationMinutes=[0-9]*" live-worker.js || echo "няма"
          git config user.name ci; git config user.email ci@fish.taxi
          git add live-worker.js && git commit -m "pull live worker [skip ci]" || true
          git push
