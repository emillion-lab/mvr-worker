name: Deploy SOS

# Живее тук, защото CLOUDFLARE_API_TOKEN е тайна на това репо (както deploy-sombra).
# Не пипа mvr-proxy — качва само Worker-а "sos" с код от репото SOS.
# Wrangler, не суров API: Durable Object миграцията и workers.dev адресът искат го.
# Админ токенът е общ с fish.taxi (KV admin:token в GPS_STORE) — нищо ново за слагане.

on:
  push:
    paths: ['.github/workflows/deploy-sos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SOS source (git, не CDN — без кеширана стара версия)
        run: |
          git clone --depth 1 https://github.com/emillion-lab/SOS.git /tmp/sos
          node --check /tmp/sos/worker/src/worker.js
          grep -q "adminToken()" /tmp/sos/worker/src/worker.js || { echo "стар код — спирам"; exit 1; }

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          R="$GITHUB_WORKSPACE/sos-deploy-report.txt"
          echo "== SOS deploy $(date -u) ==" > $R
          cd /tmp/sos/worker
          set -o pipefail
          npx --yes wrangler@3 deploy 2>&1 | grep -v -i token | grep -E "Upload|Deployed|bindings|HUB|GPS_STORE|Version|ERROR|error" | tee -a $R
          echo "" >> $R
          sleep 8
          U=https://sos.mihov-emil.workers.dev
          probe() { echo "--- $1 $2 ---" >> $R; shift; curl -s -m 20 -w "\n[HTTP %{http_code}]\n" "$@" | head -c 600 >> $R; echo "" >> $R; }
          probe GET /health "$U/health"
          probe GET "/admin/list без токен (очаква 401)" "$U/admin/list"
          probe POST "/login с грешна парола (очаква 401)" -X POST -H 'content-type: application/json' -d '{"plate":"CA0000XX","password":"x"}' "$U/login"
          probe GET "/ws без upgrade (очаква 426)" "$U/ws?token=x"

      - name: Commit report
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add sos-deploy-report.txt
          git commit -m "sos deploy report [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
