name: Redeploy Only

# Минимален деплой: прилага чакащите patch-ове, качва worker.js в Cloudflare.
# Без git push, без rebase — не пада на странични неща.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending patches (idempotent)
        run: |
          python3 patch_orgs_fix.py || true
          node --check src/worker.js && echo "syntax OK"
          # commit обратно, за да остане в репото (без rebase дрма)
          if ! git diff --quiet src/worker.js; then
            git config user.name "ci"; git config user.email "ci@fish.taxi"
            git add src/worker.js patch_orgs_fix.py 2>/dev/null || git add src/worker.js
            git commit -m "worker: orgs->users fix [skip ci]" || true
            git push || echo "push failed — продължавам, важен е деплоят"
          fi

      - name: Build worker
        run: |
          python3 - <<'EOF'
          src = open('src/worker.js').read()
          flights = open('src/flights-snippet.js').read()
          scrape = open('src/scrape-snippet.js').read()
          marker = "    if (path === '/' || path === '/health')"
          if src.count(marker) != 1:
              marker = "if (path === '/' || path === '/health')"
              assert src.count(marker) == 1, 'health-route marker not found'
          src = src.replace(marker, flights + scrape + marker)
          src = src.replace('dt < 25000', 'dt < 40000')
          import os
          os.makedirs('/tmp/build', exist_ok=True)
          open('/tmp/build/worker.js', 'w').write(src)
          print('built bytes:', len(src))
          print('има users fallback:', 'FT-ORGS-FIX-V1' in src)
          EOF

      - name: Upload to Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC="74820d71c551391ce31d309c2fcb091c"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["secret_text","plain_text"],"bindings":[{"type":"kv_namespace","name":"GPS_STORE","namespace_id":"2900a1d9de0f49deac2359e558ba5783"}],"compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@/tmp/build/worker.js;type=application/javascript+module" \
            -o /tmp/cf.json
          cat /tmp/cf.json
          python3 -c "import json; d=json.load(open('/tmp/cf.json')); exit(0 if d.get('success') else 1)" || { echo "::error::Cloudflare качването се провали"; exit 1; }
          echo ""
          echo "✅ Worker качен"
