name: Patch PubID + Retoken
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply, verify and deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          if grep -q 'FT-RETOKEN-V1' src/worker.js; then
            echo "вече е приложено — нищо за правене"
            exit 0
          fi

          python3 scripts/patch_pubid_retoken.py
          node --check src/worker.js

          echo ">>> deploy"
          cp src/worker.js /tmp/worker.js
          ACC="74820d71c551391ce31d309c2fcb091c"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["secret_text","plain_text"],"bindings":[{"type":"kv_namespace","name":"GPS_STORE","namespace_id":"2900a1d9de0f49deac2359e558ba5783"}],"compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@/tmp/worker.js;type=application/javascript+module" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('deploy success:',d.get('success'),d.get('errors'))"

          sleep 6
          B="https://mvr-proxy.mihov-emil.workers.dev"

          echo ">>> /gps — driver_id трябва да е псевдоним (d…), не телефон:"
          curl -s "$B/gps" | head -c 400; echo

          echo ">>> /request-token с непознат номер (очаква се ok:true, без съобщение):"
          curl -s -X POST "$B/request-token" -H 'Content-Type: application/json' \
            -d '{"driver_id":"359000000000"}'; echo

          echo ">>> /claim-token с невалиден nonce (очаква се HTTP 200 + текст за изтекъл линк):"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "$B/claim-token?n=deadbeef"

          echo ">>> /health:"
          curl -s "$B/health"; echo

          git config user.name ci; git config user.email ci@mvr
          git add src/worker.js
          git commit -m "worker: pubid v1 + retoken v1 [skip ci]"
          git fetch origin main && git rebase origin/main || true
          git push
