name: Recover Worker Source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=74820d71c551391ce31d309c2fcb091c
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -o deployed-worker.js
          echo "--- размер ---"; wc -c deployed-worker.js
          echo "--- има ли flights ---"; grep -c "flights" deployed-worker.js || true
          git config user.name ci; git config user.email ci@fish.taxi
          git add deployed-worker.js && git commit -m "recover deployed worker source [skip ci]" || true
          git push
