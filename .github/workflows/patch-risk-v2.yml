name: patch-worker-risk-v2
on:
  workflow_dispatch:
  schedule: [{ cron: '*/20 * * * *' }]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace /risk with the recalibrated model
        run: |
          if grep -q 'RISK_V2' src/worker.js; then echo "already applied"; exit 0; fi
          python3 scripts/patch_risk_v2.py
          node --check src/worker.js
          echo "syntax OK"

      - name: Deploy via Cloudflare API
        if: success()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! grep -q 'RISK_V2' src/worker.js; then echo "nothing to deploy"; exit 0; fi
          cp src/worker.js /tmp/worker.js
          ACC="74820d71c551391ce31d309c2fcb091c"
          R="deploy-report.txt"; echo "== /risk v2 deploy $(date -u) ==" > $R
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["secret_text","plain_text"],"bindings":[{"type":"kv_namespace","name":"GPS_STORE","namespace_id":"2900a1d9de0f49deac2359e558ba5783"}],"compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@/tmp/worker.js;type=application/javascript+module" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps({'success':d.get('success'),'errors':d.get('errors')}))" >> $R
          sleep 8
          echo "" >> $R
          echo "--- нов отговор на /risk ---" >> $R
          curl -s "https://mvr-proxy.mihov-emil.workers.dev/risk" >> $R
          cat $R
          git config user.name ci; git config user.email ci@mvr
          git add src/worker.js deploy-report.txt
          git commit -m "worker: /risk uses the recalibrated KAT model [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
