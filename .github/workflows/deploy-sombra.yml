name: Deploy SOMBRA

# Живее тук, защото CLOUDFLARE_API_TOKEN е тайна на това репо.
# Не пипа mvr-proxy — качва само Worker-а "sombra" с код от репото SOMBRA.
#
# Източникът се чете през GitHub API, а не през raw.githubusercontent:
# CDN-ът кешира около пет минути и веднъж вече качи предишна версия.

on:
  push:
    paths: ['.github/workflows/deploy-sombra.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SOMBRA worker source
        run: |
          curl -sL -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/emillion-lab/SOMBRA/contents/src/index.js" \
            -o /tmp/index.js
          echo "bytes: $(wc -c < /tmp/index.js)"
          cp /tmp/index.js /tmp/check.mjs
          node --check /tmp/check.mjs

      - name: Refuse to deploy a stale copy
        run: |
          for marker in "function carve" "function textOf" "function shapeOf"; do
            if [ "$(grep -c "$marker" /tmp/index.js)" -lt 1 ]; then
              echo "source is missing: $marker — aborting"
              exit 1
            fi
          done
          echo "source looks current"

      - name: Upload to Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          R="sombra-deploy-report.txt"
          ACC="74820d71c551391ce31d309c2fcb091c"
          D1="5d2b95a0-a8c5-4419-9e23-6a677c89981c"
          echo "== SOMBRA deploy $(date -u) ==" > $R
          echo "source bytes: $(wc -c < /tmp/index.js)" >> $R
          echo "markers: carve=$(grep -c 'function carve' /tmp/index.js) textOf=$(grep -c 'function textOf' /tmp/index.js)" >> $R

          cat > /tmp/meta.json <<EOF
          {
            "main_module": "index.js",
            "compatibility_date": "2026-07-01",
            "keep_bindings": ["secret_text"],
            "bindings": [
              { "type": "d1", "name": "DB", "id": "$D1" },
              { "type": "ai", "name": "AI" }
            ]
          }
          EOF

          echo "--- upload ---" >> $R
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/sombra" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "index.js=@/tmp/index.js;type=application/javascript+module" \
            -o /tmp/cf.json || true
          python3 -c "
          import json
          d=json.load(open('/tmp/cf.json'))
          print('success:', d.get('success'))
          for e in (d.get('errors') or []): print('ERR', e.get('code'), e.get('message'))
          " >> $R 2>&1 || head -c 500 /tmp/cf.json >> $R
          echo "" >> $R

          sleep 10
          echo "--- GET /api/calibration ---" >> $R
          curl -s "https://sombra.mihov-emil.workers.dev/api/calibration" | head -c 300 >> $R
          echo "" >> $R

      - name: Commit report
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add sombra-deploy-report.txt
          git commit -m "sombra deploy report [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
