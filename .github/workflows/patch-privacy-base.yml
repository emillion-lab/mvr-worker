name: Patch Privacy Base
# Маскира позицията на офлайн шофьор с неговата „база".
# Домашният адрес спира да се публикува през /gps.
#
# Комитът е с GITHUB_TOKEN и НЕ тригерва Deploy Worker,
# затова накрая деплоят се вика изрично.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Приложи патча
        run: python3 patch_privacy_base.py src/worker.js

      - name: Синтаксис
        run: node --check src/worker.js && echo "SYNTAX OK"

      - name: Провери, че маскирането е налице
        run: |
          grep -q "FT-PRIVACY-BASE" src/worker.js || { echo "липсва маркерът"; exit 1; }
          grep -q "maskIfOffline" src/worker.js   || { echo "липсва maskIfOffline"; exit 1; }
          grep -q "path === '/base'" src/worker.js || { echo "липсва /base"; exit 1; }
          echo "CLEAN"

      - name: Commit
        run: |
          git config user.name  "ci"
          git config user.email "ci@fish.taxi"
          if git diff --quiet src/worker.js; then
            echo "no change"
          else
            git add src/worker.js
            git commit -m "privacy: офлайн позицията се маскира с база"
            git fetch origin main && git rebase origin/main || true
            git push
          fi

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy dispatched"
