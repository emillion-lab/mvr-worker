name: Set Admin Token
# Взима админ тайната от GitHub secret (маскирана в логовете) и я записва
# като Worker secret ADMIN_TOKEN в Cloudflare. Стойността НИКОГА не влиза
# в repo-то, в лог, нито в workflow input — repo-то е публично.
#
# Преди да пуснеш:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: ADMIN_TOKEN    Value: <тайната>
#
# След това: пусни "Patch Admin Auth" (или просто изчакай следващия deploy).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload ADMIN_TOKEN to Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AT: ${{ secrets.ADMIN_TOKEN }}
        run: |
          R="admin-token-report.txt"
          echo "== Set ADMIN_TOKEN $(date -u) ==" > $R
          if [ -z "$AT" ]; then
            echo "ГРЕШКА: GitHub secret ADMIN_TOKEN не е зададен." >> $R
            echo "Settings -> Secrets and variables -> Actions -> New repository secret" >> $R
            cat $R; exit 1
          fi
          echo "дължина на тайната: ${#AT} знака" >> $R
          if [ ${#AT} -lt 24 ]; then
            echo "ГРЕШКА: твърде къса тайна (<24 знака). Спирам." >> $R
            cat $R; exit 1
          fi
          ACC="74820d71c551391ce31d309c2fcb091c"
          echo "--- upload secret ---" >> $R
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy/secrets" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c "
          import json,os
          print(json.dumps({'name':'ADMIN_TOKEN','text':os.environ['AT'],'type':'secret_text'}))
          ")" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'success':d.get('success'),'errors':d.get('errors')}))" >> $R
          echo "" >> $R
          cat $R
          git config user.name "ci"; git config user.email "ci@fish.taxi"
          git add $R
          git commit -m "admin token report [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
