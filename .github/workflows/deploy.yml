name: Deploy Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending source patches
        run: |
          # /dispatch endpoint — idempotent, сам се пропуска ако вече е вътре
          python3 patch_dispatch.py
          # офлайн прозорец 2→6 мин — idempotent
          python3 patch_offline_window.py
          # legacy_id до псевдонима в /gps — idempotent
          python3 patch_legacy_id.py
          node --check src/worker.js && echo "syntax OK"
          # ако скриптът е добавил нещо, върни го в repo-то
          if ! git diff --quiet src/worker.js; then
            git config user.name "ci"; git config user.email "ci@fish.taxi"
            git add src/worker.js
            git commit -m "worker: pending patches [skip ci]"
            git fetch origin main && git rebase origin/main || true
            git push || echo "push failed, продължавам с деплоя"
          fi

      - name: Build patched worker
        run: |
          python3 - <<'EOF'
          src = open('src/worker.js').read()
          flights = open('src/flights-snippet.js').read()
          scrape = open('src/scrape-snippet.js').read()
          marker = "    if (path === '/' || path === '/health')"
          if src.count(marker) != 1:
              marker = "if (path === '/' || path === '/health')"
              assert src.count(marker) == 1, 'health-route marker not found'
          src = src.replace(marker, flights + scrape + marker)
          src = src.replace('dt < 25000', 'dt < 40000')
          import os
          os.makedirs('/tmp/build', exist_ok=True)
          open('/tmp/build/worker.js', 'w').write(src)
          print('built bytes:', len(src))
          print('има coords в билда:', 'coords:' in src)
          print('има /dispatch в билда:', "path === '/dispatch'" in src)
          print('има legacy_id в билда:', 'legacy_id' in src)
          EOF

      - name: Deploy via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          R="deploy-report.txt"
          echo "== Deploy report $(date -u) ==" > $R
          ACC="74820d71c551391ce31d309c2fcb091c"
          echo "--- coords в src/worker.js ---" >> $R
          grep -c "coords" src/worker.js >> $R || echo 0 >> $R
          echo "--- OFFLINE_AFTER_MS в билда ---" >> $R
          grep -o "OFFLINE_AFTER_MS = [0-9] \* 60" /tmp/build/worker.js >> $R || echo "not found" >> $R
          echo "--- legacy_id в билда ---" >> $R
          grep -c "legacy_id" /tmp/build/worker.js >> $R || echo 0 >> $R
          echo "--- upload script ---" >> $R
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/mvr-proxy" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["secret_text","plain_text"],"bindings":[{"type":"kv_namespace","name":"GPS_STORE","namespace_id":"2900a1d9de0f49deac2359e558ba5783"}],"compatibility_date":"2024-01-01"};type=application/json' \
            -F "worker.js=@/tmp/build/worker.js;type=application/javascript+module" \
            -o /tmp/cf.json || true
          echo "--- суров отговор от Cloudflare ---" >> $R
          head -c 900 /tmp/cf.json >> $R || true
          echo "" >> $R
          echo "" >> $R
          echo "--- live /health ---" >> $R
          sleep 6
          curl -s https://mvr-proxy.mihov-emil.workers.dev/health >> $R
          echo "" >> $R
          echo "--- live /gps (проверка за legacy_id + driver_id) ---" >> $R
          curl -s "https://mvr-proxy.mihov-emil.workers.dev/gps" | head -c 500 >> $R
          echo "" >> $R
          echo "--- /dispatch без ключ (очаква се 401) ---" >> $R
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            "https://mvr-proxy.mihov-emil.workers.dev/dispatch" >> $R
          echo "" >> $R
          git config user.name "ci"; git config user.email "ci@fish.taxi"
          git add deploy-report.txt
          git commit -m "deploy report [skip ci]" || true
          git fetch origin main && git rebase origin/main || true
          git push
